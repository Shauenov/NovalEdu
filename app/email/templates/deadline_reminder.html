<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Deadline Reminder</title>
  </head>
  <body>
    <p>Hi {{ full_name }},</p>
    <p>Reminder: <strong>{{ task_title }}</strong> is due on {{ deadline }}.</p>
    {% if days_left is not none %}
    <p>Days left: {{ days_left }}</p>
    {% endif %}
    {% if description %}
    <p>{{ description }}</p>
    {% endif %}
  </body>
</html>
