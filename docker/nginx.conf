events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Gzip ──────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    upstream api {
        server api:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    upstream minio {
        server minio:9000;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────
    server {
        listen 80;
        server_name nobal.tech www.nobal.tech api.nobal.tech files.nobal.tech;

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS — Backend API ───────────────────────────────────
    server {
        listen 443 ssl;
        server_name api.nobal.tech;

        ssl_certificate     /etc/letsencrypt/live/nobal.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nobal.tech/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location /static/ {
            alias /static/;
        }

        location / {
            proxy_pass         http://api;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            client_max_body_size 15M;

            # Timeouts for long uploads
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }
    }

    # ── HTTPS — MinIO files (public + presigned) ──────────────
    server {
        listen 443 ssl;
        server_name files.nobal.tech;

        ssl_certificate     /etc/letsencrypt/live/nobal.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nobal.tech/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        client_max_body_size 50M;

        location / {
            proxy_pass         http://minio;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_read_timeout 120s;
            proxy_buffering off;
        }
    }

    # ── HTTPS — Frontend ──────────────────────────────────────
    server {
        listen 443 ssl;
        server_name nobal.tech www.nobal.tech;

        ssl_certificate     /etc/letsencrypt/live/nobal.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nobal.tech/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass         http://frontend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }
}
